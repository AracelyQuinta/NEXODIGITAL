<!DOCTYPE html>
<html lang="es">

<head>
    <!-- ==========================================================================
         PLANTILLA BASE DE AUTENTICACIÓN (Semana 14)
         ==========================================================================
         A diferencia de base.html, esta NO incluye el menú de navegación ni el
         pie de página. El login y el registro ocupan toda la pantalla, como en
         los sistemas profesionales: primero te identificas, luego entras al sistema.
         ========================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Acceso - Nexo Digital{% endblock %}</title>

    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Estilos propios -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">

    <style>
        /* Fondo a pantalla completa para la zona de acceso */
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #123543 0%, #1f8a8c 100%);
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 430px;
        }
        .auth-brand {
            color: #fff;
            text-align: center;
            margin-bottom: 22px;
        }
    </style>
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-card">

            <!-- Logo / marca arriba del recuadro -->
            <div class="auth-brand">
                <a href="{{ url_for('inicio') }}" class="text-white text-decoration-none">
                    <i class="bi bi-lightning-charge-fill fs-2"></i>
                    <h1 class="h4 fw-bold mt-2 mb-0">Nexo<span style="opacity:.85">Digital</span></h1>
                </a>
            </div>

            <!-- Mensajes flash (errores de login, etc.) -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show shadow-sm" role="alert">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Contenido: el formulario de login o registro -->
            {% block content %}{% endblock %}

            <!-- Enlace para volver al sitio público -->
            <p class="text-center mt-3 mb-0">
                <a href="{{ url_for('inicio') }}" class="text-white text-decoration-none small">
                    <i class="bi bi-arrow-left me-1"></i>Volver al inicio
                </a>
            </p>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/validacion.js') }}"></script>
</body>

</html>
