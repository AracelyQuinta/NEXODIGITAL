<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Nexo Digital{% endblock %}</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo.css') }}">
</head>

<body>

    <!-- Encabezado -->
    <header class="hero-header text-white text-center">
        <div class="container">
            <h1>Nexo Digital</h1>
            <p>Soluciones digitales para pequeños negocios y emprendimientos.</p>
        </div>
    </header>


    <!-- Componente reutilizable: menú -->
    {% include "components/navbar.html" %}


    <!-- Contenido principal -->
    <main>
        {% block content %}{% endblock %}
    </main>


    <!-- Componente reutilizable: pie de página -->
    {% include "components/footer.html" %}

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JS personalizado -->
    <script src="{{ url_for('static', filename='js/contacto.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
